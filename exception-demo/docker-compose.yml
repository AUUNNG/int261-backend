services:
  mysqldb:
    image: mysql:8.0
    container_name: sakila-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql@sit
      MYSQL_DATABASE: sakila
    ports:
      - "3306:3306"
    volumes:
      - ./db/sakila-schema.sql:/docker-entrypoint-initdb.d/01-sakila-schema.sql:ro
      - ./db/sakila-data.sql:/docker-entrypoint-initdb.d/02-sakila-data.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
