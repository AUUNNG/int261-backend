spring.application.name=int261-sample-exam
server.port=${SERVER_PORT:8080}

# =============================================================
# Common Settings (Jackson Strict Typing)
# =============================================================
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

# =============================================================
# [MODE 1: MYSQL] สำหรับส่งสอบ / รันกับ MySQL จริง (Default Active)
# =============================================================
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mobile_exam}
# spring.datasource.username=${DB_USER:exam}
# spring.datasource.password=${DB_PASSWORD:exam}
# spring.jpa.hibernate.ddl-auto=validate
# spring.sql.init.mode=never

# =============================================================
# [MODE 2: H2] สำหรับเทสต์ออฟไลน์ In-Memory (สลับใช้: ปิดก้อน MySQL แล้วเปิดก้อนนี้)
# =============================================================
spring.datasource.url=jdbc:h2:mem:mobile_exam
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
